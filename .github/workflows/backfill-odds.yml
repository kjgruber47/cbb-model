name: Backfill ESPN odds history

# Runs in 40-minute chunks, once an hour, until every season from 2012-13 on is
# done, then switches its own schedule off. Each chunk resumes where the last
# stopped and commits its progress, so no chunk can lose more than its own work.
# Progress: data/external/espn_odds/status.csv and progress.log.
on:
  schedule:
    - cron: "17 * * * *"   # hourly at :17 (avoids the daily snapshot times)
  workflow_dispatch:
    inputs:
      minutes:
        description: "Time budget for this chunk (minutes)"
        default: "40"
        required: true

permissions:
  contents: write
  actions: write   # lets the job turn its own schedule off when finished

# One chunk at a time; never interferes with the daily snapshot queue.
concurrency:
  group: odds-backfill
  cancel-in-progress: false

jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Backfill one chunk
        id: run
        run: |
          python -m cbb.fetch.espn_odds_history --next --max-minutes "${{ github.event.inputs.minutes || '40' }}" | tee chunk.txt
          if grep -q "^ALL_DONE" chunk.txt; then echo "all_done=true" >> "$GITHUB_OUTPUT"; fi

      - name: Commit progress
        if: always()
        run: |
          git config user.name "cbb-model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/external/espn_odds
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "ESPN odds backfill chunk $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          exit 1

      - name: Switch off the hourly schedule when everything is done
        if: steps.run.outputs.all_done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable backfill-odds.yml --repo "${{ github.repository }}"
