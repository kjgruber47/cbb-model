name: Backfill ESPN odds history

# Manual. Pulls ESPN's per-game odds records for past seasons into
# data/external/espn_odds/. Resumable: re-running continues where it stopped.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Comma-separated season groups, e.g. 2013-2015,2016-2018 (season = year it ends)"
        required: true
      sample:
        description: "Games per season to probe (0 = all)"
        default: "0"
        required: true

permissions:
  contents: write

# Own concurrency group so long backfills never block or cancel the daily snapshots.
concurrency:
  group: backfill-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.split.outputs.groups }}
    steps:
      - id: split
        run: echo "groups=$(echo '${{ github.event.inputs.seasons }}' | jq -R -c 'split(",")')" >> "$GITHUB_OUTPUT"

  backfill:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seasons: ${{ fromJson(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Backfill
        run: python -m cbb.fetch.espn_odds_history "${{ matrix.seasons }}" --sample "${{ github.event.inputs.sample }}" --summary "summary_${{ matrix.seasons }}.txt"

      - name: Commit
        if: always()
        run: |
          git config user.name "cbb-model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/external/espn_odds
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "ESPN odds backfill ${{ matrix.seasons }}"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
