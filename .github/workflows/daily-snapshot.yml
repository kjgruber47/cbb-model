name: Odds snapshot (manual)

# MANUAL ONLY. The continuous snapshots now come from snapshot-loop.yml (GitHub's
# scheduler dropped most of this workflow's scheduled runs). Use this to
# snapshot one specific date, or to run a snapshot + prediction by hand.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Single date to snapshot (YYYYMMDD); blank = today + 2 days"
        required: false

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Snapshot ESPN odds
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python -m cbb.fetch.espn_live --date "${{ github.event.inputs.date }}"
          else
            python -m cbb.fetch.espn_live
          fi

      - name: Predict upcoming games
        if: github.event.inputs.date == ''
        continue-on-error: true
        run: python -m cbb.predict.daily

      - name: Commit
        run: |
          git config user.name "cbb-model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Odds snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
