name: Fetch rosters

# Current ESPN rosters for every D-I team, used by the preseason model.
# Manual, plus weekly through the preseason (rosters change until opening night).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * 10,11 1"   # Mondays 12:00 UTC in October and November

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  rosters:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - run: python -m cbb.fetch.rosters

      - name: Commit
        run: |
          git config user.name "cbb-model bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/external/rosters
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Rosters $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
