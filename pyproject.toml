[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbb-model"
version = "0.1.0"
description = "College basketball predictive model for betting markets"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]
